<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interaktiv SVG | Eventnavn</title>
    <link rel="stylesheet" href="./css/starter.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/svg.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-content">
        <a class="site-logo" href="index.html"> <img class="logo" src="svg/logo.svg" alt="" /></a>
        <nav class="site-nav">
          <button popovertarget="menu">Menu</button>
          <ul class="menu" id="menu" popover>
            <li><a href="./index.html">Forside</a></li>
            <li><a href="./svg.html" aria-current="page">Kom og Smag</a></li>
            <li><a href="./om-eventet.html">Om eventet</a></li>
            <li><a href="./tilmelding.html">Tilmeld dig</a></li>
            <li><a href="./opsamling.html">Opsamling</a></li>
            <button popovertarget="menu">Luk</button>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="svg-page">
        <header class="svg-intro">
          <h1 class="start">Kom og smag</h1>
        </header>

        <section class="svg-layout">
          <div class="svg-placeholder">
            <svg class="svg-hus" viewBox="490 0 1350 1050" aria-hidden="true">
              <use class="hus" href="./svg/hus_lys.svg#hus"></use>
              <use class="lys" href="./svg/hus_lys.svg#lyset"></use>
            </svg>
          </div>

          <article class="panel">
            <h2>Udforsk eventet</h2>
            <div class="accordion">
              <!-- TODO: Lav om til details/summary -->
              <details id="advent1" class="accordion-item" name="advent" data-position="foerste">
                <summary>1. advent</summary>
                <p>menukort</p>
                <img src="./svg/menukort_1.svg" alt="menukort for 1 advent" />
              </details>

              <details id="advent2" class="accordion-item" name="advent" data-position="anden">
                <summary>2. advent</summary>
                <p>menukort</p>
                <img src="./svg/menukort_2.svg" alt="menukort for 2 advent" />
              </details>

              <details id="advent3" class="accordion-item" name="advent" data-position="tredje">
                <summary>3. advent</summary>
                <p>menukort</p>
                <img src="./svg/menukort_3.svg" alt="menukort for 3 advent" />
              </details>

              <details id="advent4" class="accordion-item" name="advent" data-position="fjerde">
                <summary>4. advent</summary>
                <p>menukort.</p>
                <img src="./svg/menukort_4.svg" alt="menukort for 4 advent" />
              </details>
            </div>
          </article>
        </section>
      </section>
      <script src="./js/script.js"></script>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <a class="site-logo" href="index.html"> <img class="logo" src="svg/logo.svg" alt="" /></a>
        <p>Caroline, Lulu & Rebekka MMD</p>
      </div>
    </footer>
  </body>
</html>
