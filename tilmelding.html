<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formular</title>
    <link rel="stylesheet" href="./css/starter.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/formular.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="header-content">
        <a class="site-logo" href="index.html"> <img class="logo" src="svg/logo.svg" alt="" /></a>
        <nav class="site-nav">
          <button popovertarget="menu">Menu</button>
          <ul class="menu" id="menu" popover>
            <li><a href="./index.html">Forside</a></li>
            <li><a href="./svg.html">Kom og Smag</a></li>
            <li><a href="./om-eventet.html">Om eventet</a></li>
            <li><a href="./tilmelding.html" aria-current="page">Tilmeld dig</a></li>
            <li><a href="./opsamling.html">Opsamling</a></li>
            <button popovertarget="menu">Luk</button>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <section class="model">
        <h1 class="h-et">Tilmeld dig</h1>

        <form class="form-placeholder" action="./opsamling.html">
          <div class="tilmelding">
            <label for="field-nickname">Navn:</label>
            <input type="text" id="field-nickname" name="nickname" required />
          </div>

          <div class="tilmelding">
            <label for="field-email">Email:</label>
            <input type="email" id="field-email" name="email" required />
          </div>

          <div class="tilmelding">
            <label for="field-alder">Alder:</label>
            <input type="number" id="field-alder" name="alder" required />
          </div>

          <div class="tilmelding">
            <label for="field-nationalitet">Nationalitet:</label>
            <input type="text" id="field-nationalitet" name="nationalitet" />
          </div>

          <div class="tilmelding">
            <fieldset>
              <legend>Hvilke dage vil du deltage?</legend>

              <label for="field-Deltagelse-3">
                <input type="checkbox" id="field-Deltagelse-3" name="deltagelse" value="advent1" />
                1. Advent
              </label>
              <label for="field-Deltagelse-4">
                <input type="checkbox" id="field-Deltagelse-4" name="deltagelse" value="advent2" />
                2. Advent
              </label>
              <label for="field-Deltagelse-5">
                <input type="checkbox" id="field-Deltagelse-5" name="deltagelse" value="advent3" />
                3. Advent
              </label>
              <label for="field-Deltagelse-6">
                <input type="checkbox" id="field-Deltagelse-6" name="deltagelse" value="advent4" />
                4. Advent
              </label>
            </fieldset>
          </div>
          <button type="submit" class="submit">Send</button>
        </form>
        <img class="img" src="./svg/pynt-2.svg" alt="" />
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-content">
        <a class="site-logo" href="index.html"> <img class="logo" src="svg/logo.svg" alt="" /></a>
        <p>Caroline, Lulu & Rebekka MMD</p>
      </div>
    </footer>
    <script src="./js/script.js"></script>
  </body>
</html>
